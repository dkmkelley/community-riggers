{% extends "base.html" %}

{% block title %}Delete Rigger | Community Riggers{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Confirm Deletion</h5>
            </div>
            <div class="card-body">
                <p class="card-text">Are you sure you want to remove
                    <strong>{{ rigger['name'] }}</strong> from the directory?
                    This cannot be undone.</p>
                <form method="POST" class="d-inline">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </form>
                <a href="/riggers" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
